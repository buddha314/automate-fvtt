<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Nuclear power plant">
  <rect width="128" height="128" rx="10" fill="#1b2a1f"/>
  <!-- steam puffs -->
  <g fill="#cfe8d6" opacity="0.85">
    <circle cx="44" cy="30" r="9"/>
    <circle cx="56" cy="24" r="11"/>
    <circle cx="70" cy="28" r="8"/>
    <circle cx="86" cy="30" r="10"/>
    <circle cx="98" cy="26" r="8"/>
  </g>
  <!-- left cooling tower -->
  <path d="M34 104 C 38 78, 38 70, 44 50 L 64 50 C 70 70, 70 78, 74 104 Z"
        fill="#e8e2d4" stroke="#9a937f" stroke-width="2"/>
  <path d="M41 62 C 50 66, 58 66, 67 62 L 64 50 L 44 50 Z" fill="#cdc7b6"/>
  <!-- right cooling tower -->
  <path d="M70 104 C 73 82, 73 76, 78 60 L 96 60 C 101 76, 101 82, 104 104 Z"
        fill="#ded8c9" stroke="#9a937f" stroke-width="2"/>
  <path d="M76 70 C 84 73, 90 73, 98 70 L 96 60 L 78 60 Z" fill="#c3bdac"/>
  <!-- ground -->
  <rect x="20" y="104" width="88" height="8" rx="2" fill="#3a5a3f"/>
  <!-- radiation trefoil -->
  <g transform="translate(50 92)" fill="#ffd23f">
    <circle r="6" fill="#ffd23f"/>
    <circle r="2.2" fill="#1b2a1f"/>
    <g>
      <path d="M0 0 L 5.2 -9 A 10.4 10.4 0 0 1 -5.2 -9 Z"/>
      <path d="M0 0 L 10.4 0 A 10.4 10.4 0 0 1 5.2 9 Z" transform="rotate(120)"/>
      <path d="M0 0 L 10.4 0 A 10.4 10.4 0 0 1 5.2 9 Z" transform="rotate(240)"/>
    </g>
  </g>
</svg>
